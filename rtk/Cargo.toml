[package]
name = "rtk"
version = "0.1.0"
edition = "2021"
description = "RTK (Rust Token Killer) — truncates/dedupes large Bash/PowerShell tool output before it reaches the Claude Code model context."

[[bin]]
name = "rtk"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
